plugins { id 'com.android.application' }

android { namespace 'com.antvance.finance'; compileSdk 35
    defaultConfig { applicationId 'com.antvance.finance'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1' }
}

// Keep Kotlin runtime modules on one compatible line and avoid the old
// kotlin-stdlib-jdk7/jdk8 artifacts that duplicate classes in stdlib 1.8.x.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.9'
}

// BiometricPrompt 1.1.0 requires FragmentActivity. The existing Java source
// was authored against Activity, so normalize the declaration before Java compilation.
tasks.named('preBuild').configure {
    doLast {
        def src = file('src/main/java/com/antvance/finance/MainActivity.java')
        def text = src.getText('UTF-8')
        text = text.replace('import androidx.core.content.ContextCompat;', 'import androidx.core.content.ContextCompat;\nimport androidx.fragment.app.FragmentActivity;')
        text = text.replace('public class MainActivity extends Activity {', 'public class MainActivity extends FragmentActivity {')
        src.write(text, 'UTF-8')
    }
}
